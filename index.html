<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>IchApp – Deine Schaltzentrale</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235e5ce6'/%3E%3Cstop offset='1' stop-color='%230a84ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M35 8 L15 36h12l-2 20 24-30H35z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">

    <!-- Sidebar / Navigation -->
    <nav class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 5 13.5h5L10 22l9-11.5h-5.5z" fill="#fff"/></svg>
        </span>
        <span class="brand-name">IchApp</span>
      </div>

      <div class="nav-items" id="navItems">
        <button class="nav-item" data-view="dashboard"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        </span><span class="nav-label">Dashboard</span></button>

        <button class="nav-item" data-view="gym"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>
        </span><span class="nav-label">Gym</span></button>

        <button class="nav-item" data-view="goals"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
        </span><span class="nav-label">Ziele</span></button>

        <button class="nav-item" data-view="finance"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 9.5h19M6.5 14.5h4"/></svg>
        </span><span class="nav-label">Finanzen</span></button>

        <button class="nav-item" data-view="nutrition"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 10.5c.8 5.5-2.5 9.8-7.5 10.4C7 21.5 3.7 17.2 4.5 11.7 5.1 7.6 8.3 5.5 12 6.6c3.7-1.1 6.9.4 7.5 3.9z"/><path d="M12 6.5c0-2 1.5-3.5 3.5-4"/></svg>
        </span><span class="nav-label">Ernährung</span></button>

        <button class="nav-item" data-view="sleep"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13.2A8.6 8.6 0 0 1 10.8 3 8.6 8.6 0 1 0 21 13.2z"/></svg>
        </span><span class="nav-label">Schlaf</span></button>

        <button class="nav-item" data-view="habits"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5 21 6.5l-4 4"/><path d="M21 6.5H8a5 5 0 0 0-5 5"/><path d="M7 21.5l-4-4 4-4"/><path d="M3 17.5h13a5 5 0 0 0 5-5"/></svg>
        </span><span class="nav-label">Habits</span></button>

        <button class="nav-item" data-view="journal"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17.5H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M20 19.5H6.5A2.5 2.5 0 0 1 4 17"/><path d="M9 7h7"/></svg>
        </span><span class="nav-label">Tagebuch</span></button>

        <button class="nav-item" data-view="education"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6.5 11.5V16c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8v-4.5"/><path d="M22 9v5.5"/></svg>
        </span><span class="nav-label">Ausbildung</span></button>
      </div>

      <div class="sidebar-footer">
        <button class="nav-item" data-view="settings"><span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6.5h10M17.5 6.5H21M3 12h3M10.5 12H21M3 17.5h10M17.5 17.5H21"/><circle cx="15.5" cy="6.5" r="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="17.5" r="2"/></svg>
        </span><span class="nav-label">Einstellungen</span></button>
      </div>
    </nav>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="viewTitle">Dashboard</h1>
          <div class="topbar-date" id="topbarDate"></div>
        </div>
        <div class="topbar-right">
          <div class="level-badge" id="levelBadge" title="Dein Level – sammle XP durch Einträge!">
            <div class="level-ring" id="levelRing"></div>
            <div class="level-info">
              <span class="level-name" id="levelName">Level 1</span>
              <span class="level-xp" id="levelXp">0 XP</span>
            </div>
          </div>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="Schließen">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/gym.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/finance.js"></script>
  <script src="js/views/nutrition.js"></script>
  <script src="js/views/sleep.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/education.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
