<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>IchApp – Deine Schaltzentrale</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">

    <!-- Sidebar / Navigation -->
    <nav class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-bolt">⚡</span>
        <span class="brand-name">IchApp</span>
      </div>

      <div class="nav-items" id="navItems">
        <button class="nav-item" data-view="dashboard"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></button>
        <button class="nav-item" data-view="gym"><span class="nav-icon">💪</span><span class="nav-label">Gym</span></button>
        <button class="nav-item" data-view="goals"><span class="nav-icon">🎯</span><span class="nav-label">Ziele</span></button>
        <button class="nav-item" data-view="finance"><span class="nav-icon">💶</span><span class="nav-label">Finanzen</span></button>
        <button class="nav-item" data-view="nutrition"><span class="nav-icon">🍎</span><span class="nav-label">Ernährung</span></button>
        <button class="nav-item" data-view="sleep"><span class="nav-icon">😴</span><span class="nav-label">Schlaf</span></button>
        <button class="nav-item" data-view="habits"><span class="nav-icon">🔁</span><span class="nav-label">Habits</span></button>
        <button class="nav-item" data-view="journal"><span class="nav-icon">📓</span><span class="nav-label">Tagebuch</span></button>
        <button class="nav-item" data-view="education"><span class="nav-icon">🎓</span><span class="nav-label">Ausbildung</span></button>
      </div>

      <div class="sidebar-footer">
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙️</span><span class="nav-label">Einstellungen</span></button>
      </div>
    </nav>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="viewTitle">Dashboard</h1>
          <div class="topbar-date" id="topbarDate"></div>
        </div>
        <div class="topbar-right">
          <div class="level-badge" id="levelBadge" title="Dein Level – sammle XP durch Einträge!">
            <div class="level-ring" id="levelRing"></div>
            <div class="level-info">
              <span class="level-name" id="levelName">Level 1</span>
              <span class="level-xp" id="levelXp">0 XP</span>
            </div>
          </div>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="Schließen">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/gym.js"></script>
  <script src="js/views/goals.js"></script>
  <script src="js/views/finance.js"></script>
  <script src="js/views/nutrition.js"></script>
  <script src="js/views/sleep.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/education.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
